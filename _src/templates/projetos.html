{% extends 'base.html' %}
{% from 'partials/macros.html' import project_card %}
{% block content %}
<section class="page-head">
  <h1 class="page-head__title">{{ t.projects_page.title }}</h1>
  <div class="filters" role="group" aria-label="{{ t.projects_page.filters_label }}" data-filters>
    {% for key, label in t.projects_page.filters.items() %}
    <button type="button" class="tag {{ 'tag--black' if key == 'all' else 'tag--white' }}" data-filter="{{ key }}" aria-pressed="{{ 'true' if key == 'all' else 'false' }}">{{ label }}</button>
    {% endfor %}
  </div>
</section>
<section class="projects projects--page" aria-label="{{ t.projects_page.title }}">
  <div class="projects__grid">
    {% for p in projects %}{{ project_card(p, lang, t, prefix) }}{% endfor %}
  </div>
</section>
{% endblock %}
