{% raw %}<div class="loader" id="loader" aria-hidden="true"><div class="loader__panel" id="loader-panel"></div></div>
<script src="/assets/js/logo-anim.js"></script>
<script>
(function () {
  var root = document.documentElement, el = document.getElementById('loader');
  if (root.classList.contains('no-loader')) { el.remove(); return; }
  try { sessionStorage.setItem('ima-loader', '1'); } catch (e) {}
  root.classList.add('is-loading');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var anim = window.IMALogo(document.getElementById('loader-panel'), { onExit: function (ex) { el.style.opacity = 1 - ex; } });
  function finish() { root.classList.remove('is-loading'); el.remove(); document.dispatchEvent(new Event('loader:done')); }
  if (reduce) { anim.render(3.3); setTimeout(function () { el.style.transition = 'opacity .4s'; el.style.opacity = 0; setTimeout(finish, 400); }, 700); return; }
  var start = null;
  function tick(now) { if (start === null) start = now; var t = (now - start) / 1000; anim.render(Math.min(t, anim.duration)); if (t < anim.duration) requestAnimationFrame(tick); else finish(); }
  requestAnimationFrame(tick);
})();
</script>
{% endraw %}
