home:
  hero_alt: Projeto em destaque
  projects_title: Projetos
  about_tag: Sobre mim
  about_wordmark_alt: igor marques art.
  about_p1: Sou o Igor, designer de marcas e ilustrador em Belo Horizonte. Crio identidades visuais completas para negócios que querem ser lembrados, seja uma ideia saindo do papel, seja uma empresa pronta para o próximo passo. Cada decisão visual tem um porquê, e cada marca nasce para funcionar no dia a dia.
  about_p2: Antes do design veio o desenho. Fiz o técnico em Artes Visuais e, até hoje, é no papel que minhas ideias começam. Desde 2020 trabalho com design, passando por produto, campanhas e branding, sempre buscando o mesmo equilíbrio, estratégia, sensibilidade e rigor técnico.
  about_photo_alt: Retrato de Igor Marques
  about_more: Ver mais sobre mim
  cta_title: Vamos criar algo juntos?
  cta_text: Me conte sobre você e o seu projeto pelo formulário. Eu retorno o contato e marcamos uma conversa para entender o seu momento, os seus objetivos e o que a sua marca precisa. A partir disso, preparo um orçamento sob medida para você.
