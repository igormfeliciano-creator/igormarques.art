  about_wordmark_alt: igor marques art.
  about_p1: I'm Igor, a brand designer and illustrator based in Belo Horizonte, Brazil. I create complete visual identities for businesses that want to be remembered, whether it's an idea leaving the page or a company ready for its next step. Every visual decision has a reason, and every brand is built to work day to day.
  about_p2: Drawing came before design. I trained as a visual arts technician, and to this day my ideas start on paper. I've worked in design since 2020, across product, campaigns and branding, always looking for the same balance of strategy, sensitivity and technical rigor.
