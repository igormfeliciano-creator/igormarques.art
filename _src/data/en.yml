about_page:
  title: About me
  description: Igor Marques, brand designer and illustrator based in Belo Horizonte, Brazil.
  tags: [Brand design, Visual identity, Illustration]
  wordmark_alt: igor marques art.
  headline: Brands with strategy and a hand of their own.
  intro: I'm Igor, a brand designer and illustrator based in Belo Horizonte, Brazil. I create visual identities for businesses that want to be remembered, whether it's an idea leaving the page or a company ready for its next step. In my work, strategy, sensitivity and technical rigor go hand in hand. Every visual decision has a reason, and every brand is built to work day to day, from a social post to a storefront.
  photo1_alt: Igor Marques
  photo2_alt: Igor Marques drawing
  what_title: What I do
  what_subtitle: Complete brands, ready to use.
  what_tags: [Brands from scratch, Rebranding, Visual identity]
  what_text: I develop the brand end to end, with symbol, typography, colors, grid, image language and the applications the business will actually use. Everything is documented in a living brand guide, so anyone on the team (or another designer) can carry the work forward without losing consistency. When the project calls for it, the guide also gets a version ready for AI tools, so the brand stays consistent even in machine-generated content.
  story_title: From paper to brand
  story_text: I was born in Governador Valadares and moved to Belo Horizonte at 13. That's where I connected with art. I trained as a visual arts technician before I even knew about design, and paper is still my favorite place to think, among sketches, drafts and paintings. From drawing I moved to product design and then to branding. I've single-handedly led the rebranding of a fast-growing tech company, along with sub-brands and event identities. I specialized in Branding with Marcelo Kimura, and I bring one question to every project. Does this brand work in real life?
