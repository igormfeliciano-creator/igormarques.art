# Projetos na ordem em que aparecem no site.
# Projetos com "case" ganham página própria em /projetos/<slug>/ (conteúdo em data/cases/<slug>.yml).
# Os demais levam para o case publicado fora do site (campo "url").
# "filters" alimenta os filtros da página Projetos; "tags" são as etiquetas exibidas no card.
